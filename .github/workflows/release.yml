name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build
        run: wails3 task build

      - name: Archive binary
        shell: pwsh
        run: Compress-Archive -Path bin/coffer.exe -DestinationPath coffer-${{ github.ref_name }}-windows-amd64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: coffer-*.zip
          generate_release_notes: true
