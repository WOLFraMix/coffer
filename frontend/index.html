<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Coffer</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #12141a;
            color: #e8e8ef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 14vh;
            min-height: 100vh;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 24px;
        }

        #unlock,
        #create {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        #unlock input,
        #create input {
            background: #1c1f29;
            border: 1px solid #2c3140;
            color: inherit;
            padding: 10px 14px;
            border-radius: 8px;
            width: 280px;
            font-size: 15px;
        }

        button {
            background: #4f7cff;
            border: 0;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.1);
        }

        #app {
            display: none;
            width: 500px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1c1f29;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
        }

        .meta {
            display: flex;
            flex-direction: column;
        }

        .issuer {
            font-size: 12px;
            color: #8b93a7;
        }

        .name {
            font-size: 14px;
        }

        .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .code {
            font-family: ui-monospace, monospace;
            font-size: 24px;
            letter-spacing: 3px;
            cursor: pointer;
        }

        .code:hover {
            color: #4f7cff;
        }

        .timer {
            font-size: 11px;
            color: #8b93a7;
            width: 34px;
            text-align: right;
        }

        .del {
            background: none;
            border: 0;
            color: #8b93a7;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .del:hover {
            color: #ff6b6b;
        }

        form {
            display: flex;
            gap: 6px;
            margin-top: 16px;
        }

        form input {
            background: #1c1f29;
            border: 1px solid #2c3140;
            color: inherit;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        #f-issuer {
            width: 90px;
        }

        #f-name {
            width: 110px;
        }

        #f-secret {
            width: 150px;
        }

        #err {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }
    </style>
</head>

<body>
    <h1>🔐 Coffer</h1>

    <!-- Создание сейфа: первый запуск -->
    <div id="create" style="display:none">
        <input id="new-password" type="password" placeholder="Придумайте мастер-пароль" />
        <input id="new-password2" type="password" placeholder="Повторите пароль" />
        <button id="btn-create">Создать сейф</button>
    </div>

    <!-- Разблокировка: сейф существует -->
    <div id="unlock" style="display:none">
        <input id="password" type="password" placeholder="Мастер-пароль" />
        <button id="btn-unlock">Открыть</button>
    </div>

    <!-- Основной экран -->
    <div id="app">
        <div id="list"></div>
        <form id="add">
            <input id="f-issuer" placeholder="Сервис" />
            <input id="f-name" placeholder="Аккаунт" />
            <input id="f-secret" placeholder="Base32-секрет" />
            <button>Добавить</button>
        </form>
    </div>
    <div id="err"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
