<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffer</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <!-- Создание сейфа (первый запуск) -->
    <section id="create" class="card" style="display:none">
        <h1>🔐 Coffer</h1>
        <p class="hint">Придумайте мастер-пароль. Он не восстанавливается:
            потеряете — потеряете все коды.</p>
        <input id="new-password" type="password" placeholder="Мастер-пароль (мин. 8)">
        <input id="new-password2" type="password" placeholder="Повторите пароль">
        <button id="btn-create">Создать сейф</button>
        <p id="err"></p>
    </section>

    <!-- Разблокировка -->
    <section id="unlock" class="card" style="display:none">
        <h1>🔐 Coffer</h1>
        <input id="password" type="password" placeholder="Мастер-пароль">
        <button id="btn-unlock">Открыть</button>
        <a id="btn-reset" href="#">Забыли пароль? Сбросить сейф…</a>
        <p id="err"></p>
    </section>

    <!-- Основной экран -->
    <main id="app" style="display:none">
        <h1>🔐 Coffer</h1>

        <!-- Поиск и резервные копии -->
        <div id="tools">
            <input id="search" type="text" placeholder="Поиск по сервису или имени…">
            <div class="backup">
                <input id="backup-password" type="password" placeholder="Пароль копии">
                <button id="btn-export" class="ghost" type="button">Экспорт копии</button>
            </div>
            <div class="backup">
                <input id="import-password" type="password" placeholder="Пароль копии">
                <button id="btn-import" class="ghost" type="button">Импорт из файла…</button>
            </div>
        </div>

        <!-- Форма добавления аккаунта -->
        <form id="add">
            <input id="f-issuer" placeholder="Сервис">
            <input id="f-name" placeholder="Аккаунт">
            <input id="f-secret" placeholder="Base32-секрет">
            <button type="submit">Добавить</button>
        </form>

        <div id="list"></div>
        <a id="btn-lock" href="#">Заблокировать</a>
        <p id="err"></p>
    </main>

    <script type="module" src="src/main.ts"></script>
</body>

</html>
